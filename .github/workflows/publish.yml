name: Publish packages

# Publishes any workspace whose package.json version is not yet on npm. Runs when a
# GitHub Release is published (or manually from the Actions tab).
#
# Auth is the repo's NPM_TOKEN secret (granular automation token), fed to npm via
# setup-node's registry-url + NODE_AUTH_TOKEN. The OIDC Trusted Publishing path was
# tried 2026-07-21 and failed ENEEDAUTH because the packages were never registered as
# Trusted Publishers on npmjs.com (Package settings -> Publishing access -> GitHub
# Actions: org "scadable", repo "sdk", workflow "publish.yml"); register them and the
# token can be dropped. id-token: write stays for --provenance attestation either way.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes an .npmrc that reads NODE_AUTH_TOKEN, so the publish step below
          # authenticates with the NPM_TOKEN secret.
          registry-url: 'https://registry.npmjs.org'

      # Provenance + granular tokens need a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Publish workspaces whose version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for dir in core next react astro vue svelte embed wizard; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already on npm)"
            else
              echo "publish $name@$ver"
              ( cd "$dir" && npm publish --access public --provenance )
            fi
          done
